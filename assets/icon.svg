<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The mark carries FORM Golf's discipline — one arc, one chainring, a
       confident stroke — and the word names the sport underneath it. The word
       is a caption, not a partner: lighter weight, tracked out, given the
       bottom strip while the mark takes everything above with a clear gap. So
       it costs the mark about a tenth of its height rather than half, which is
       what the first version did. Placement and gap are both measured from
       real bounding boxes, stroke and descenders included. -->
  <rect width="128" height="128" rx="28" fill="#F2C230"/>
  <g id="mark" transform="translate(30.41 20.96) scale(1.3947)">
    <path d="M5.5 43C7.5 20 14 7.5 24.66 7.5" fill="none" stroke="#0B0B0B" stroke-width="6.2" stroke-linecap="round"/>
    <path d="M30.70 -2.02 L31.66 -4.27 L36.34 -4.27 L37.30 -2.02 L38.40 -1.57 L40.67 -2.48 L43.98 0.83 L43.07 3.10 L43.52 4.20 L45.77 5.16 L45.77 9.84 L43.52 10.80 L43.07 11.90 L43.98 14.17 L40.67 17.48 L38.40 16.57 L37.30 17.02 L36.34 19.27 L31.66 19.27 L30.70 17.02 L29.60 16.57 L27.33 17.48 L24.02 14.17 L24.93 11.90 L24.48 10.80 L22.23 9.84 L22.23 5.16 L24.48 4.20 L24.93 3.10 L24.02 0.83 L27.33 -2.48 L29.60 -1.57 Z M39.64 7.50 A5.64 5.64 0 1 0 28.36 7.50 A5.64 5.64 0 1 0 39.64 7.50 Z" fill="#0B0B0B" fill-rule="evenodd"/>
  </g>
  <text id="word" x="64" y="107.5" text-anchor="middle" fill="#0B0B0B"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12.4" font-weight="500" letter-spacing="1.15">cycling</text>
</svg>
